buildscript {
  ext {
    kotlinVersion = "1.9.24"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
  namespace "com.areffects"
  compileSdk 34

  defaultConfig {
    minSdk 23
  }

  // The RN 0.86 / EAS toolchain compiles Java at 17. Kotlin must
  // target the same JVM version or AGP fails the build with
  // "Inconsistent JVM Target Compatibility" (Android build 38 died
  // at :react-native-ar-effects:compileReleaseKotlin on a 17 vs 1.8
  // split). Bytecode version only; no source change.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Pinned to the 0.10.14 release line (same line as the CocoaPods
  // MediaPipeTasksVision dependency). Gradle resolution is confirmed at
  // first build; see the PR body.
  implementation "com.google.mediapipe:tasks-vision:0.10.14"
  implementation "androidx.camera:camera-core:1.3.4"
  implementation "androidx.camera:camera-camera2:1.3.4"
  implementation "androidx.camera:camera-lifecycle:1.3.4"
  implementation "androidx.camera:camera-view:1.3.4"
  // M3: the LiveKit React Native fork's VideoEffect registry. The
  // fork's npm package is @livekit/react-native-webrtc. React Native's
  // settings plugin (used by Expo prebuild) names scoped packages via
  // its nameCleansed rule — scope + underscore, NOT Expo's hyphen
  // rule — so the Gradle project is :livekit_react-native-webrtc.
  // The hyphen form fails project evaluation (0.1.0/0.1.1 Android
  // builds died there). org.webrtc classes arrive transitively
  // via the fork's `api 'io.github.webrtc-sdk:android:144.7559.05'`.
  implementation project(':livekit_react-native-webrtc')
}
