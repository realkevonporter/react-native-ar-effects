# Publish react-native-ar-effects to npm — MANUAL DISPATCH ONLY.
#
# This workflow NEVER runs on push or on pull requests: it is
# workflow_dispatch-only, so merging a PR publishes nothing by itself.
#
# Authentication is npm trusted publishing (OIDC) — no stored token.
# The trusted publisher is bound on npmjs to owner realkevonporter,
# repo react-native-ar-effects, workflow publish.yml. The publish steps
# must NOT set NODE_AUTH_TOKEN: when it is set, npm uses it instead of
# the OIDC token and trusted publishing is bypassed.
#
# What it does, in order: check out, set up Node with the npm registry,
# ensure npm supports trusted publishing, install (devDependencies carry
# the TypeScript compiler and the peer type declarations the build
# needs), build dist/ from packages/src, verify the dist entry points
# exist, show the would-be tarball contents with `npm pack --dry-run`,
# then publish — or, with the dry-run input, stop at
# `npm publish --dry-run` instead.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run instead of publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
      - name: Build dist/
        run: npm run build
      - name: Verify dist entry points
        run: test -f dist/index.js && test -f dist/index.d.ts
      - name: Show tarball contents
        run: npm pack --dry-run
      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish
